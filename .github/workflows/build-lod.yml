name: build-lod-bundles

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build_lod.py'
      - 'scripts/validate_lod.py'
      - 'data/skeletons/**'
      - '.github/workflows/build-lod.yml'

permissions:
  contents: write

jobs:
  build-lod:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build topology-preserving LOD bundles
        run: python scripts/build_lod.py --input data/skeletons --output data/lod

      - name: Validate LOD hashes and invariants
        run: python scripts/validate_lod.py --dir data/lod

      - name: Print aggregate reduction
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m = json.loads(Path('data/lod/metrics.json').read_text())
          levels = {}
          for neuron in m['neurons']:
              for name, x in neuron['levels'].items():
                  d = levels.setdefault(name, {'orig': 0, 'rendered': 0})
                  d['orig'] += neuron['original_segments']
                  d['rendered'] += x['rendered_segments']
          for name, d in levels.items():
              reduction = 100 * (1 - d['rendered'] / d['orig']) if d['orig'] else 0
              print(f"{name}: {d['rendered']:,}/{d['orig']:,} segments ({reduction:.2f}% reduction)")
          PY

      - name: Commit generated LOD research bundles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lod
          if git diff --cached --quiet; then
            echo "No LOD changes to commit."
          else
            git commit -m "Build topology-preserving MaleCNS LOD bundles"
            git push origin HEAD:main
          fi
